<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Fullscreen</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
  }
  video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  a#klik {
    position: fixed;
    inset: 0;
    z-index: 1;
  }
</style>

</head>
<body>

<video autoplay muted loop playsinline>
  <source src="https://cdn.videy.co/YYmBf9l21.mp4" type="video/mp4">
</video>

<a id="klik" href="https://otieu.com/4/10532248"></a>

</body>
</html>
